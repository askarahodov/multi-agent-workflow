# Read-only scheduled/PR audit. Explicit two-run maintenance on main only.
name: Branch Cleanup Audit

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/branch-cleanup.yml"
      - "scripts/git/maintenance/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only audit, archive reviewed refs, or explicit apply"
        type: choice
        options: [audit, archive, apply]
        default: audit
      archive_run_id:
        description: "Successful prior archive run ID (apply only)"
        type: string
        default: ""
      confirmation:
        description: "Apply only: ARCHIVE_SAVED_WORKTREES_CHECKED"
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'audit'
    name: branch cleanup audit (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest (for script self-check)
        run: python -m pip install pytest

      - name: Run cleanup script test suite
        working-directory: scripts/git/maintenance
        run: python -m pytest tests -q

      - name: Audit all remote branches and PR dependencies (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/git/maintenance/audit-remote-branches.py --repo "$GITHUB_REPOSITORY"

      - name: Audit merged / missing-upstream branches (report only)
        working-directory: scripts/git/maintenance
        run: |
          echo "::group::stale branch report"
          python cleanup-branches.py --repo "$GITHUB_WORKSPACE" --dry-run || true
          echo "::endgroup::"

  archive-rehearsal:
    # Read-only rehearsal against exact current main and reviewed refs.
    # Not an apply authorization; PR artifacts cannot pass apply's run check.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rehearse full archive and restore without remote mutation
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: python scripts/git/maintenance/archive-reviewed-branches.py rehearse --directory "$RUNNER_TEMP/reviewed-branch-rehearsal"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-branch-rehearsal
          path: ${{ runner.temp }}/reviewed-branch-rehearsal/
          if-no-files-found: error
          retention-days: 90

  archive:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'archive'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: reviewed-branch-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive reviewed exact refs without deleting
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/git/maintenance/archive-reviewed-branches.py archive --directory "$RUNNER_TEMP/reviewed-branches"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-branch-archive
          path: ${{ runner.temp }}/reviewed-branches/
          if-no-files-found: error
          retention-days: 90

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'apply'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
    concurrency:
      group: reviewed-branch-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate explicit operator confirmation and archive run identifier
        env:
          ARCHIVE_RUN: ${{ inputs.archive_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == 'ARCHIVE_SAVED_WORKTREES_CHECKED' ]]
          [[ "$ARCHIVE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-branch-archive
          path: ${{ runner.temp }}/reviewed-branches
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ github.token }}
      - name: Verify previous archive and delete only exact reviewed refs
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_RUN: ${{ inputs.archive_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python scripts/git/maintenance/archive-reviewed-branches.py apply \
            --directory "$RUNNER_TEMP/reviewed-branches" \
            --archive-run "$ARCHIVE_RUN" --confirmation "$CONFIRMATION"
