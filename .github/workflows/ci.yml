name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Superseded PR revisions should not consume CI capacity; protected pushes
# retain their full verification and are never auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read
  attestations: write
  checks: write

defaults:
  run:
    shell: bash

jobs:
  backend-test:
    name: Backend pytest (${{ matrix.subsystem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - subsystem: agent-management
            path: services/agent-management
          - subsystem: orchestration-server
            path: services/orchestration-server
          - subsystem: quality-gates
            path: services/quality-gates
          - subsystem: runtime-hardening
            path: services/runtime-hardening
          - subsystem: tools
            path: tools
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ./packages/shared
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "sqlalchemy[asyncio]>=2.0"
          pip install "pydantic>=2.7" "aiosqlite>=0.20" "httpx>=0.27" "jsonschema>=4.20"
          pip install "cryptography>=42" "pydantic-settings>=2.3" "pyyaml>=6.0" "prometheus-client>=0.20"
          pip install "pytest>=8" "pytest-asyncio>=0.23" "openapi_spec_validator"

      - name: Run pytest
        working-directory: ${{ matrix.path }}
        run: python -m pytest tests -q
        continue-on-error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ strategy.job-index }}
          path: ${{ matrix.path }}/tests/
          retention-days: 30

  postgres-schema-upgrade:
    name: PostgreSQL concurrent schema/index migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orchestration_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d orchestration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install orchestration and disposable PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/shared
          python -m pip install -e "services/orchestration-server[postgres]"
          python -m pip install "pytest>=8" "pytest-asyncio>=0.23"
      - name: Check simultaneous PostgreSQL migrations and preserved event data
        working-directory: services/orchestration-server
        env:
          MAW_TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci_disposable_only@127.0.0.1:5432/orchestration_ci
        run: python -m pytest tests/test_postgres_schema_upgrade.py -q

  frontend-test:
    name: Frontend (typecheck + vitest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test:run

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-frontend
          path: apps/frontend/
          retention-days: 30

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ── Optional: Release workflow ──────────────────────────────────────────────
