name: Coordination channel isolation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR revisions should not consume CI capacity; protected pushes
# retain their full verification and are never auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  isolate-coordination:
    name: Reject external QA channel files in product main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Git branch ownership of external QA handoff
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -- '.coordination/external-qa' | grep -q .; then
            echo "::error::External QA handoff files must live only on coord/external-qa, not main."
            git ls-files -- '.coordination/external-qa'
            exit 1
          fi
          echo "PASS: product tree has no tracked external-QA handoff files."
