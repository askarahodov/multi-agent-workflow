name: Documentation dependency check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/frontend/package.json'
      - 'apps/frontend/package-lock.json'
      - 'docs/**'
      - '.github/workflows/docs-dependency-check.yml'
      - 'scripts/check-docs-deps.js'
      - 'scripts/check-docs-deps.test.js'
      - 'scripts/check-mermaid-fence.test.js'
      - 'docs/.vitepress/mermaid-fence.mjs'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/frontend/package.json'
      - 'apps/frontend/package-lock.json'
      - 'docs/**'
      - '.github/workflows/docs-dependency-check.yml'
      - 'scripts/check-docs-deps.js'
      - 'scripts/check-docs-deps.test.js'

# Superseded PR revisions should not consume CI capacity; protected pushes
# retain their full verification and are never auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs-deps:
    name: Docs npm ci and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Guard root and frontend dependency graphs (offline)
        run: |
          node --test scripts/check-docs-deps.test.js
          node scripts/check-docs-deps.js
          node --test scripts/check-mermaid-fence.test.js
      - name: Regenerate lockfile on networked runner
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: docs-regenerated-package-lock
          path: package-lock.json
          retention-days: 7
      - name: Ensure regenerated lockfile was committed
        run: git diff --exit-code -- package-lock.json
      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund
      - name: Build documentation
        run: npm run docs:build
      - name: Test link resolver
        run: node --test scripts/check-links.test.js
      - name: Check generated documentation links
        run: npm run docs:check-links

  docs-audit:
    name: Docs npm audit (high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit root documentation dependencies (high/critical)
        shell: bash
        run: |
          set +e
          npm audit --json --audit-level=high > docs-audit-report.json
          audit_status=$?
          set -e
          if [ ! -s docs-audit-report.json ]; then
            echo "::error::npm audit returned no JSON (exit $audit_status)"
            exit 1
          fi
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          let report;
          try {
            report = JSON.parse(readFileSync('docs-audit-report.json', 'utf8'));
          } catch {
            console.error('::error::npm audit returned invalid JSON');
            process.exit(1);
          }
          const counts = report.metadata?.vulnerabilities;
          if (report.error || !counts ||
              !Number.isInteger(counts.high) || !Number.isInteger(counts.critical) ||
              counts.high < 0 || counts.critical < 0) {
            console.error('::error::npm audit unavailable or incomplete');
            process.exit(1);
          }
          console.log('Root docs advisory counts: ' +
            ['info', 'low', 'moderate', 'high', 'critical']
              .map(level => level + '=' + (counts[level] ?? 0)).join(' '));
          for (const [name, advisory] of Object.entries(report.vulnerabilities ?? {})) {
            if (advisory.severity === 'high' || advisory.severity === 'critical') {
              console.log('Root docs advisory: package=' + name +
                ' severity=' + advisory.severity +
                ' range=' + (advisory.range ?? '?') +
                ' fix=' + JSON.stringify(advisory.fixAvailable));
            }
          }
          if (counts.high > 0 || counts.critical > 0) {
            console.error('::error::Root documentation dependencies contain high/critical advisories');
            process.exit(1);
          }
          JS
          # npm audit may fail independently of the advisory counts (registry
          # outages, invalid responses); never turn those failures green.
          if [ "$audit_status" -ne 0 ]; then
            echo "::error::npm audit command failed with exit $audit_status"
            exit 1
          fi
      - name: Preserve root dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-npm-audit
          path: docs-audit-report.json
          if-no-files-found: warn
          retention-days: 30
