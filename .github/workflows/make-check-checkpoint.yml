# Execute the same Makefile target used by developers, on an isolated CI host.
# The ordinary Quality Gate remains required. This additional checkpoint does
# not confer independent approval or prove any developer worktree was tested.
name: Make Check Checkpoint

on:
  pull_request:
    paths:
      - AGENT_GITFLOW_RULES.md
      - Makefile
      - .github/workflows/make-check-checkpoint.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: make-check-checkpoint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  make-check:
    name: make check (CI checkpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Prepare the same Python environment as the developer Makefile
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ./packages/shared
          .venv/bin/python -m pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "sqlalchemy[asyncio]>=2.0" "pydantic>=2.7" "aiosqlite>=0.20" "httpx>=0.27" "jsonschema>=4.20" "cryptography>=42" "pydantic-settings>=2.3" "pyyaml>=6.0" "prometheus-client>=0.20" "pytest>=8" "pytest-asyncio>=0.23" "openapi-spec-validator>=0.7"
          echo "PYTHONPATH=$PWD/packages/agent-runtime" >> "$GITHUB_ENV"
          .venv/bin/python -m pip check
      - name: Install locked frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Execute exact Makefile target
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          printf 'PR head: %s\nPR base: %s\n' "$PR_HEAD" "$PR_BASE"
          make check
      - name: Record CI checkpoint provenance
        if: always()
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo '### Make check checkpoint'
            echo "Checkout: $(git rev-parse HEAD)"
            echo "PR head: $PR_HEAD"
            echo "PR base: $PR_BASE"
            echo 'Execution environment: ephemeral GitHub-hosted runner, not a developer host.'
            echo 'Check the actual make check step conclusion; independent approval and local worktree verification are separate.'
          } >> "$GITHUB_STEP_SUMMARY"
