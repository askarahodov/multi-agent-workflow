name: Native agent cross-service E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-agent-e2e:
    name: Native LLM-tool-Contract Gate (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate authenticated native QA Compose overlay (no containers started)
        run: python scripts/check_native_qa_compose.py

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install local product packages for isolated test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./shared
          python -m pip install -e ./agent-management -e ./orchestration-server -e ./quality-gates
          python -m pip install 'pytest>=8' 'pytest-asyncio>=0.23'

      - name: Native product integration with empty HOME and no Hermes in PATH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maw-no-hermes"
          PYTHON_BIN="$(command -v python)"
          SAFE_PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin"
          test ! -e "$RUNNER_TEMP/maw-no-hermes/.hermes"
          HOME="$RUNNER_TEMP/maw-no-hermes" PATH="$SAFE_PATH" "$PYTHON_BIN" -m pytest tests/native_agent_e2e -q


  protected-qa-live-compose:
    name: Secure QA TLS / RBAC / SQLite Compose (offline live)
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Bootstrap disposable signed-QA TLS and private UID fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 scripts/prepare_native_qa_compose_smoke.py "$RUNNER_TEMP/maw-secure-qa"
          test -f "$RUNNER_TEMP/maw-secure-qa/compose.env"
          test ! -e "$HOME/.hermes"

      - name: Build, boot, authenticate, restart and verify protected QA Compose
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/maw-secure-qa"
          compose() {
            docker compose --env-file "$root/compose.env" \
              -f compose.trusted-sqlite-control.yml \
              -f compose.native-qa-runtime.yml \
              --profile trusted-sqlite-control \
              --profile native-qa-runtime "$@"
          }
          cleanup() {
            code="$?"
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              compose ps -a || true
              compose logs --no-color --tail=80 secure-orchestration secure-quality-gates || true
            fi
            compose down -v --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT
          compose config --quiet
          # No model worker, privileged gateway, dev stack or paid provider.
          compose up -d --build secure-orchestration secure-quality-gates
          state=""
          for n in $(seq 1 35); do
            state="$(compose ps --format json secure-quality-gates | python3 -c \
              'import json,sys; s=sys.stdin.read().strip(); print(json.loads(s).get("Health","") if s else "")')"
            if [ "$state" = "healthy" ]; then break; fi
            sleep 2
          done
          test "$state" = "healthy"
          compose run --rm --no-deps native-qa-controller \
            python -m quality_gates.native_qa_controller preflight
          compose run --rm --no-deps native-qa-controller \
            python -m quality_gates.native_qa_compose_smoke create
          compose restart secure-orchestration secure-quality-gates
          sleep 6
          compose run --rm --no-deps native-qa-controller \
            python -m quality_gates.native_qa_compose_smoke verify
          echo "SECURE_QA_COMPOSE_TLS_RBAC_RESTART_ACCEPTED (no provider calls)"
