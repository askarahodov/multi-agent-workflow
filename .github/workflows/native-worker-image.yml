name: Native worker image preflight

on:
  push:
    branches: [main]
    paths:
      - 'orchestration-server/**'
      - 'agent-management/**'
      - 'shared/**'
      - 'compose.trusted-git-artifacts.yml'
      - 'compose.native-worker-preflight.yml'
      - '.github/workflows/native-worker-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'orchestration-server/**'
      - 'agent-management/**'
      - 'shared/**'
      - 'compose.native-worker-preflight.yml'
      - '.github/workflows/native-worker-image.yml'

permissions:
  contents: read

jobs:
  image-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compose syntax
        run: docker compose -f compose.native-worker-preflight.yml --profile native-worker-preflight config --quiet
      - name: Validate production-style worker overlay (disabled unless selected)
        run: docker compose -f compose.trusted-sqlite-control.yml -f compose.native-worker-runtime.yml --profile native-worker-runtime config --quiet
      - name: Verify Git-enabled secure overlays are Compose-valid
        run: docker compose -f compose.trusted-sqlite-control.yml -f compose.native-worker-runtime.yml -f compose.trusted-git-artifacts.yml --profile trusted-sqlite-control --profile native-worker-runtime config --quiet
      - name: Build opt-in worker image without secrets
        run: docker build -f orchestration-server/Dockerfile.native-worker -t maw-native-worker-preflight:test .
      - name: Default invocation must refuse unconfigured execution
        run: |
          set +e
          output=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges maw-native-worker-preflight:test 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 2
          case "$output" in
            *"preflight FAILED"*) ;;
            *) exit 1 ;;
          esac
      - name: Real worker entrypoint must fail closed without credentials
        run: |
          set +e
          output=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges maw-native-worker-preflight:test python -m orchestration_server.native_worker_cli run 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 3
          case "$output" in
            *"FAIL_CLOSED"*) ;;
            *) exit 1 ;;
          esac
