# Unified CI quality gate for the Multi-Agent Workflow Platform.
#
# Blocks merging of low-quality changes. Each job maps to one check of the
# local gate (`make check`), and the final `quality-gate` job aggregates them so
# a single required status check fails if *any* check fails.
#
#   backend   -> `make backend-test` (pytest for every Python subsystem)
#   packaging -> clean install of first-party Python distributions
#   compose-smoke -> Docker Compose build and live health (dependency changes only)
#   frontend  -> `make typecheck` + `make frontend-check` (tsc, vitest, schema, build)
#   lint      -> `make lint` (eslint)
#   security  -> `make security` (quality-gates SecurityGate: secret + dependency scan)

name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend pytest (${{ matrix.subsystem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subsystem:
          - agent-management
          - orchestration-server
          - quality-gates
          - runtime-hardening
          - tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./shared
          python -m pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "sqlalchemy[asyncio]>=2.0" "pydantic>=2.7" "aiosqlite>=0.20" "httpx>=0.27" "jsonschema>=4.20" "cryptography>=42" "pydantic-settings>=2.3" "pyyaml>=6.0" "prometheus-client>=0.20"
          python -m pip install "pytest>=8" "pytest-asyncio>=0.23" "openapi-spec-validator>=0.7"
      - name: Run tests
        working-directory: ${{ matrix.subsystem }}
        run: python -m pytest tests -q

  packaging:
    name: packaging (clean Python install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install first-party packages from a clean checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./shared ./orchestration-server ./agent-management ./runtime-hardening
          python -m pip check
          python -c "import shared, orchestration_server, agent_management, runtime; print('All first-party imports OK')"

  compose-smoke:
    name: local Compose build and health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Compose-related changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          printf 'Changed files:\\n%s\\n' "$changed"
          if grep -Eq '(^docker-compose\\.yml$|^\\.env\\.example$|(^|/)Dockerfile$|^shared/|^frontend/package(-lock)?\\.json$|^[^/]+/pyproject\\.toml$)' <<< "$changed"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping expensive Docker build: only application/doc files changed.'
          fi
      - name: Validate Compose configuration
        if: steps.changes.outputs.run == 'true'
        run: docker compose config --quiet
      - name: Build and start local stack
        if: steps.changes.outputs.run == 'true'
        run: docker compose up --build -d
      - name: Wait for six healthy services
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            mapfile -t ids < <(docker compose ps -q)
            if [ "${#ids[@]}" -eq 6 ]; then
              mapfile -t states < <(docker inspect --format '{{.State.Health.Status}}' "${ids[@]}")
              healthy=0
              for state in "${states[@]}"; do
                if [ "$state" = healthy ]; then healthy=$((healthy + 1)); fi
              done
              if [ "$healthy" -eq 6 ]; then
                echo "All six Compose services are healthy"
                exit 0
              fi
              echo "waiting: $healthy/6 healthy (attempt $attempt)"
            else
              echo "waiting: ${#ids[@]}/6 running (attempt $attempt)"
            fi
            sleep 5
          done
          echo "::error::Compose stack did not become healthy"
          docker compose ps -a
          exit 1
      - name: Verify host endpoints
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:18000/health
          curl --fail --silent --show-error http://127.0.0.1:8001/health
          curl --fail --silent --show-error http://127.0.0.1:8002/health
          curl --fail --silent --show-error http://127.0.0.1:8003/health
          curl --fail --silent --show-error http://127.0.0.1:5173/ > /dev/null
      - name: Compose state and logs on failure
        if: failure() && steps.changes.outputs.run == 'true'
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=120
      - name: Clean up disposable stack
        if: always() && steps.changes.outputs.run == 'true'
        run: docker compose down -v --remove-orphans

  frontend:
    name: frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm run test:run
      - name: Schema validation
        run: npm run schema:validate
      - name: Production build
        run: npm run build

  lint:
    name: lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  security:
    name: security scan (quality-gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115" "uvicorn[standard]>=0.30" "sqlalchemy[asyncio]>=2.0" \
            "pydantic>=2.7" "aiosqlite>=0.20" "httpx>=0.27"
      - name: Secret + dependency scan
        run: python scripts/security_scan.py

  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    needs: [backend, packaging, compose-smoke, frontend, lint, security]
    if: always()
    steps:
      - name: Assert every required check succeeded
        env:
          BACKEND: ${{ needs.backend.result }}
          PACKAGING: ${{ needs.packaging.result }}
          COMPOSE: ${{ needs.compose-smoke.result }}
          FRONTEND: ${{ needs.frontend.result }}
          LINT: ${{ needs.lint.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          echo "backend=$BACKEND packaging=$PACKAGING compose=$COMPOSE frontend=$FRONTEND lint=$LINT security=$SECURITY"
          for result in "$BACKEND" "$PACKAGING" "$COMPOSE" "$FRONTEND" "$LINT" "$SECURITY"; do
            if [ "$result" != "success" ]; then
              echo "::error::quality gate failed: a required check did not succeed"
              exit 1
            fi
          done
          echo "quality gate: ALL CHECKS PASSED"
