name: Refresh frontend lockfile (issue 22)
on:
  push:
    branches: [fix/issue-22-frontend-dependency-audit]
    paths:
      - 'frontend/package.json'
      - '.github/workflows/refresh-frontend-lockfile.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'askarahodov/multi-agent-workflow' && github.ref == 'refs/heads/fix/issue-22-frontend-dependency-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve lockfile without lifecycle scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --engine-strict --no-audit
      - name: Commit only reproducible lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(deps): refresh Vitest 5 lockfile (#22)'
          git push origin HEAD:fix/issue-22-frontend-dependency-audit
