name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0-rc1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────
  # Validate Release
  # ─────────────────────────────────────────────────────────
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      is_prerelease: ${{ steps.extract_version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            # Determine if prerelease from version pattern
            if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Prerelease: $PRERELEASE"

      - name: Verify tag exists
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          # actions/checkout already materialises refs/tags/${VERSION} when this
          # workflow is triggered by a tag push, so no fetch is needed here.
          # Do NOT run an unforced `git fetch --tags`: for an annotated/signed tag
          # the local ref may point at the commit while origin holds a different
          # (tag object) ref, and the fetch aborts with
          # "would clobber existing tag" — which under `set -e` failed the job
          # before this check even ran.
          # `^{commit}` peels annotated tags AND matches lightweight tags.
          if git rev-parse --verify --quiet "refs/tags/${VERSION}^{commit}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} found locally ($(git rev-parse --verify "refs/tags/${VERSION}^{commit}"))"
          elif git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} found on origin (not present locally)"
          else
            echo "::error::Tag ${VERSION} not found locally or on origin"
            exit 1
          fi

      - name: Verify version consistency
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          
          # Check package.json
          PKG_VERSION=$(jq -r .version package.json)
          if [[ "$PKG_VERSION" != "$VERSION_NO_V" ]]; then
            echo "package.json version ($PKG_VERSION) doesn't match tag ($VERSION_NO_V)"
            exit 1
          fi
          
          # Check pyproject.toml if exists
          if [[ -f pyproject.toml ]]; then
            PY_VERSION=$(grep '^version =' pyproject.toml | cut -d'"' -f2)
            if [[ "$PY_VERSION" != "$VERSION_NO_V" ]]; then
              echo "pyproject.toml version ($PY_VERSION) doesn't match tag ($VERSION_NO_V)"
              exit 1
            fi
          fi
          
          echo "Version consistency check passed"

      - name: Verify release notes exist
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          if [[ ! -f "RELEASE_NOTES_${VERSION}.md" && ! -f "docs/releases/${VERSION}.md" ]]; then
            echo "Release notes not found for $VERSION"
            exit 1
          fi
          echo "Release notes found"

      - name: Verify CHANGELOG has version section
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          if ! grep -q "## \[$VERSION_NO_V\]" CHANGELOG.md; then
            echo "CHANGELOG.md missing section for $VERSION_NO_V"
            exit 1
          fi
          echo "CHANGELOG section found"

  # ─────────────────────────────────────────────────────────
  # Build & Push Docker Images
  # ─────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Images
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Each service's release Dockerfile now lives under its migrated
        # monorepo directory (services/* and apps/frontend).
        include:
          - service: orchestration-server
            dockerfile: services/orchestration-server/Dockerfile.release
          - service: agent-management
            dockerfile: services/agent-management/Dockerfile.release
          - service: runtime-hardening
            dockerfile: services/runtime-hardening/Dockerfile.release
          - service: frontend
            dockerfile: apps/frontend/Dockerfile.release
          - service: quality-gates
            dockerfile: services/quality-gates/Dockerfile.release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=${{ needs.validate.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.is_prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Source-baked production Dockerfile (COPYs the application source), so
          # the pushed image is standalone-runnable. The plain dev Dockerfile
          # (services/<service>/Dockerfile or apps/frontend/Dockerfile) is the
          # local-dev image (dependencies only, source bind-mounted) and is kept
          # for the Compose stack — do not switch the release matrix back to it.
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Output image digest
        run: |
          echo "Image: ${{ steps.meta.outputs.tags }}"

  # ─────────────────────────────────────────────────────────
  # Create Source Tarball
  # ─────────────────────────────────────────────────────────
  source:
    name: Create Source Tarball
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source tarball
        id: create_source_tarball
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          git archive --format=tar.gz --prefix="multi-agent-workflow-${VERSION_NO_V}/" \
            -o "multi-agent-workflow-${VERSION_NO_V}.tar.gz" "${VERSION}"
          echo "TARBALL=multi-agent-workflow-${VERSION_NO_V}.tar.gz" >> $GITHUB_OUTPUT

      - name: Generate checksum
        run: |
          sha256sum ${{ steps.create_source_tarball.outputs.TARBALL }} > ${{ steps.create_source_tarball.outputs.TARBALL }}.sha256
          cat ${{ steps.create_source_tarball.outputs.TARBALL }}.sha256

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: |
            multi-agent-workflow-*.tar.gz
            multi-agent-workflow-*.tar.gz.sha256
          retention-days: 90

  # ─────────────────────────────────────────────────────────
  # Security Scan Release Images
  # ─────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan Images
    needs: [validate, docker]
    runs-on: ubuntu-latest
    # Job-scoped least-privilege token. `security-events: write` is required by
    # github/codeql-action/upload-sarif to publish findings to the code-scanning
    # API (without it the step fails with "Resource not accessible by
    # integration"); `packages: read` is required for `docker pull` from GHCR.
    # Job-level permissions replace the workflow-level block for this job, so
    # every scope this job needs is listed explicitly.
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      # One service failing must not cancel the scans of the others — all five
      # images have to report their own result on every release.
      fail-fast: false
      matrix:
        service: [orchestration-server, agent-management, runtime-hardening, frontend, quality-gates]
    steps:
      - name: Pull image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ needs.validate.outputs.version }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ needs.validate.outputs.version }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          # trivy-action defaults `limit-severities-for-sarif` to false, which
          # UNSETS TRIVY_SEVERITY before the scan so the SARIF (and therefore the
          # exit-code gate) is evaluated over ALL severities — the declared
          # CRITICAL,HIGH gate would then trip on MEDIUM/LOW/UNKNOWN findings.
          # Keep the SARIF and the gate scoped to the configured severity.
          limit-severities-for-sarif: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: ${{ matrix.service }}

  # ─────────────────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [validate, docker, source, security-scan]
    runs-on: ubuntu-latest
    # Publish only when the pipeline actually produced the release inputs
    # (validate passed, Docker images built, source tarball built). A failing
    # security scan is still tolerated (so the release is not blocked by scan
    # findings alone), but a failed `validate`/`source` must NOT reach this job —
    # the previous `if: always()` let it run with no artifact and produced the
    # "Artifact not found: source-tarball" cascade.
    if: >-
      ${{
        !cancelled()
        && needs.validate.result == 'success'
        && needs.docker.result == 'success'
        && needs.source.result == 'success'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: artifacts

      - name: Prepare release notes
        id: release_notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if [[ -f "RELEASE_NOTES_${VERSION}.md" ]]; then
            RELEASE_NOTES=$(cat "RELEASE_NOTES_${VERSION}.md")
          else
            RELEASE_NOTES=$(cat "docs/releases/${VERSION}.md")
          fi
          # Escape for JSON
          RELEASE_NOTES_ESCAPED=$(echo "$RELEASE_NOTES" | jq -Rs .)
          echo "notes=$RELEASE_NOTES_ESCAPED" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          files: |
            artifacts/multi-agent-workflow-*.tar.gz
            artifacts/multi-agent-workflow-*.tar.gz.sha256
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────
  # Post-Release Validation
  # ─────────────────────────────────────────────────────────
  validate-release:
    name: Validate Released Artifacts
    needs: [validate, release]
    runs-on: ubuntu-latest
    # Explicit gate. A job with only `needs:` and no `if` inherits GitHub's
    # implicit `success()` over its WHOLE upstream graph, so the tolerated
    # failure of `security-scan` (which sits upstream via `release`) silently
    # skipped this job in run 41054089214 — the standalone image smoke test and
    # the non-root/pull assertions never executed in CI. Depend only on the jobs
    # whose artifacts this job actually consumes, exactly like `release` does.
    if: >-
      ${{
        !cancelled()
        && needs.validate.result == 'success'
        && needs.release.result == 'success'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker images pullable
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          for service in orchestration-server agent-management runtime-hardening frontend quality-gates; do
            echo "Pulling ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${service}:${VERSION}..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${service}:${VERSION}
            echo "✅ ${service} pulled successfully"
          done

      - name: Verify source tarball checksum
        run: |
          cd artifacts
          sha256sum -c multi-agent-workflow-*.tar.gz.sha256
          echo "✅ Source tarball checksum verified"

      - name: Smoke test released orchestration-server image (standalone)
        # The release images are source-baked (Dockerfile.release COPYs the
        # application source), so the published image must boot with NO host bind
        # mounts. This asserts the artifact is standalone-runnable: `docker run`
        # the pulled image directly, then GET /health == 200. Do not reintroduce a
        # source bind mount — that is what docker-compose.yml does for the
        # local-dev images and it would hide a regression back to dev-mode images.
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestration-server:${VERSION}"
          docker run -d --name orch-smoke -p 18000:8000 \
            -e AUTH_ENABLED=false -e SHARED_SECRET=smoke -e LOG_LEVEL=INFO \
            "$IMG"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18000/health; then ok=1; break; fi
            sleep 2
          done
          docker logs orch-smoke || true
          docker rm -f orch-smoke || true
          test "$ok" = "1"

      - name: Assert released images run as non-root
        # Every release image declares a dedicated non-root USER; docker run
        # defaults to it, so the running uid must never be 0.
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          for service in orchestration-server agent-management runtime-hardening frontend quality-gates; do
            IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${service}:${VERSION}"
            uid=$(docker run --rm --entrypoint id "$IMG" -u)
            echo "${service}: uid=${uid}"
            if [ "$uid" = "0" ]; then
              echo "::error::${service} image runs as root"
              exit 1
            fi
          done

      - name: Run Fibonacci sample task
        run: |
          # This would run the full E2E test against released images
          # For now, verify the test file exists
          if [[ -f "tests/e2e/release-validation.test.ts" ]]; then
            echo "✅ E2E validation test file exists"
          else
            echo "⚠️ E2E validation test not found, skipping"
          fi

  # ─────────────────────────────────────────────────────────
  # Notify
  # ─────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: [validate, release, validate-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.release.result }}" == "success" && "${{ needs.validate-release.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Release ${{ needs.validate.outputs.version }} published successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Release ${{ needs.validate.outputs.version }} failed. Check workflow logs." >> $GITHUB_OUTPUT
          fi

      - name: Post to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${{ steps.status.outputs.message }}\"}" \
            ${{ env.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Comment on GitHub Release
        # Only comment when a Release was actually created; otherwise
        # getReleaseByTag returns 404 ("Not Found") and fails the notify job.
        if: ${{ github.event_name == 'push' && needs.release.result == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const tag = "${{ needs.validate.outputs.version }}"
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: release.data.id,
              body: "${{ steps.status.outputs.message }}"
            })