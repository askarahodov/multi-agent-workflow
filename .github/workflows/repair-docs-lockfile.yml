name: Repair docs lockfile on PR branch

on:
  push:
    branches:
      - fix/docs-math-renderer-dependabot-208
    paths:
      - '.github/workflows/repair-docs-lockfile.yml'

permissions:
  contents: write

jobs:
  commit-generated-lockfile:
    if: github.repository == 'askarahodov/multi-agent-workflow' && github.ref == 'refs/heads/fix/docs-math-renderer-dependabot-208'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate lockfile, without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile package entries
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json')
          if (!lock.packages['node_modules/markdown-it-mathjax3']) process.exit(1)
          if (lock.packages['node_modules/markdown-it-katex']) process.exit(1)
          NODE
      - name: Commit lockfile only if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'fix(docs): synchronize MathJax package lock (#208)'
          git push origin HEAD:refs/heads/fix/docs-math-renderer-dependabot-208
