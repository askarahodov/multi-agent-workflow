[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-management"
version = "0.1.0"
description = "Agent management subsystem and LLM provider abstraction layer: agent definitions, instances, lifecycle, provider adapters (OpenRouter, HuggingFace, custom), model profiles, token usage tracking, tool policy enforcement."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "maw-shared==0.1.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openapi-spec-validator>=0.7"]

[tool.setuptools.packages.find]
include = ["agent_management*", "agent_management.providers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]