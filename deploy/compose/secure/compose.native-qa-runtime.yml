# Opt-in signed QA transport. Combine ONLY with compose.trusted-sqlite-control.yml.
# Do not combine with docker-compose.yml (AUTH_ENABLED=false).
# Credentials belong to protected host files; no values in Compose environment.
# QG test subprocesses are not a security boundary for untrusted multi-tenant code.
x-qa-runtime: &qa-runtime
  user: "10003:10003"
  read_only: true
  privileged: false
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 768m
  cpus: 1.5
  restart: "no"
  init: true
  networks:
    - trusted-control
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m

x-qa-bind: &qa-bind
  type: bind
  bind:
    create_host_path: false

services:
  secure-orchestration:
    # Extends the trusted control plane with two *separate* QA credentials.
    # Keep worker WRITE key in the original trusted-control file.
    environment:
      MAW_ORCH_QA_ADMIN_KEY_FILE: /run/maw-secrets/qa-control-admin.key
      MAW_ORCH_QA_SIGNING_KEY_FILE: /run/maw-secrets/qa-signing.key
    volumes:
      - <<: *qa-bind
        source: "${MAW_ORCH_QA_ADMIN_HOST_FILE:-./.maw-qa-control-admin-NOT-CONFIGURED}"
        target: /run/maw-secrets/qa-control-admin.key
        read_only: true
      - <<: *qa-bind
        source: "${MAW_ORCH_QA_SIGNING_HOST_FILE:-./.maw-qa-orch-sign-NOT-CONFIGURED}"
        target: /run/maw-secrets/qa-signing.key
        read_only: true

  secure-quality-gates:
    profiles: ["native-qa-runtime"]
    <<: *qa-runtime
    build:
      context: .
      dockerfile: services/quality-gates/Dockerfile.native-qa
    environment:
      MAW_SECURE_QG_ENABLED: "1"
      AUTH_ENABLED: "true"
      MAW_QG_ADMIN_KEY_FILE: /run/maw-secrets/qg-admin.key
      MAW_QG_SIGNING_KEY_FILE: /run/maw-secrets/qg-signing.key
      MAW_QG_DATABASE_PATH: /srv/maw/qa-data/qg.sqlite3
      QG_EVIDENCE_ROOT: /srv/maw/qa-evidence
      QG_ARTIFACT_ROOT: /srv/maw/qa-artifacts
      QG_TLS_CERT_FILE: /run/maw-tls/quality.crt
      QG_TLS_KEY_FILE: /run/maw-secrets/quality-tls.key
      GIT_OPTIONAL_LOCKS: "0"
    volumes:
      - <<: *qa-bind
        source: "${MAW_QA_DATA_HOST_DIR:-./.maw-qa-data-NOT-CONFIGURED}"
        target: /srv/maw/qa-data
      - <<: *qa-bind
        source: "${MAW_QA_EVIDENCE_HOST_DIR:-./.maw-qa-evidence-NOT-CONFIGURED}"
        target: /srv/maw/qa-evidence
      - <<: *qa-bind
        source: "${MAW_QA_ARTIFACT_HOST_DIR:-./.maw-qa-artifact-NOT-CONFIGURED}"
        target: /srv/maw/qa-artifacts
      - <<: *qa-bind
        source: "${MAW_QA_GIT_REPO_HOST_DIR:-./.maw-qa-git-NOT-CONFIGURED}"
        target: /srv/maw/operator-source
        read_only: true
      - <<: *qa-bind
        source: "${MAW_QA_WORKTREE_HOST_DIR:-./.maw-qa-worktrees-NOT-CONFIGURED}"
        target: /srv/maw/qa-worktrees
        read_only: true
      - <<: *qa-bind
        source: "${MAW_QG_ADMIN_KEY_HOST_FILE:-./.maw-qa-service-admin-NOT-CONFIGURED}"
        target: /run/maw-secrets/qg-admin.key
        read_only: true
      - <<: *qa-bind
        source: "${MAW_QG_SIGNING_KEY_HOST_FILE:-./.maw-qa-service-sign-NOT-CONFIGURED}"
        target: /run/maw-secrets/qg-signing.key
        read_only: true
      - <<: *qa-bind
        source: "${MAW_QG_TLS_KEY_HOST_FILE:-./.maw-qa-service-tlskey-NOT-CONFIGURED}"
        target: /run/maw-secrets/quality-tls.key
        read_only: true
      - <<: *qa-bind
        source: "${MAW_QG_TLS_CERT_HOST_FILE:-./.maw-qa-service-tlscert-NOT-CONFIGURED}"
        target: /run/maw-tls/quality.crt
        read_only: true
    command: ["python", "-m", "quality_gates.secure_qa_serve"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',9444),2); s.close()"]
      interval: 10s
      retries: 10
      timeout: 5s
      start_period: 15s

  native-qa-controller:
    profiles: ["native-qa-runtime"]
    <<: *qa-runtime
    build:
      context: .
      dockerfile: services/quality-gates/Dockerfile.native-qa
    environment:
      MAW_QA_CONTROLLER_ENABLED: "1"
      MAW_QA_ORCH_URL: https://secure-orchestration:8443
      MAW_QA_SERVICE_URL: https://secure-quality-gates:9444
      MAW_QA_ORCH_CA_FILE: /run/maw-certs/orchestration-ca.crt
      MAW_QA_SERVICE_CA_FILE: /run/maw-certs/quality-ca.crt
      MAW_QA_ORCH_ADMIN_KEY_FILE: /run/maw-secrets/qa-control-admin.key
      MAW_QA_SERVICE_ADMIN_KEY_FILE: /run/maw-secrets/qg-admin.key
      MAW_QA_GIT_REPOSITORY: /srv/maw/operator-source
      MAW_QA_WORKTREE_HOME: /srv/maw/qa-worktrees
      MAW_QA_GIT_EXECUTABLE: /usr/bin/git
      MAW_QA_TEST_COMMAND_JSON: "${MAW_QA_TEST_COMMAND_JSON:-[\"python\",\"-B\",\"-c\",\"raise SystemExit(1)\"]}"
      MAW_QA_MAX_POLLS: "${MAW_QA_MAX_POLLS:-100}"
      MAW_QA_POLL_SECONDS: "${MAW_QA_POLL_SECONDS:-2}"
    volumes:
      - <<: *qa-bind
        source: "${MAW_QA_GIT_REPO_HOST_DIR:-./.maw-qa-git-NOT-CONFIGURED}"
        target: /srv/maw/operator-source
      - <<: *qa-bind
        source: "${MAW_QA_WORKTREE_HOST_DIR:-./.maw-qa-worktrees-NOT-CONFIGURED}"
        target: /srv/maw/qa-worktrees
      - <<: *qa-bind
        source: "${MAW_QA_CONTROL_ADMIN_HOST_FILE:-./.maw-qa-controller-admin-NOT-CONFIGURED}"
        target: /run/maw-secrets/qa-control-admin.key
        read_only: true
      - <<: *qa-bind
        source: "${MAW_QA_SERVICE_ADMIN_HOST_FILE:-./.maw-qa-controller-service-admin-NOT-CONFIGURED}"
        target: /run/maw-secrets/qg-admin.key
        read_only: true
      - <<: *qa-bind
        source: "${MAW_QA_ORCH_CA_HOST_FILE:-./.maw-qa-orch-ca-NOT-CONFIGURED}"
        target: /run/maw-certs/orchestration-ca.crt
        read_only: true
      - <<: *qa-bind
        source: "${MAW_QA_SERVICE_CA_HOST_FILE:-./.maw-qa-service-ca-NOT-CONFIGURED}"
        target: /run/maw-certs/quality-ca.crt
        read_only: true
    depends_on:
      secure-quality-gates:
        condition: service_healthy
      secure-orchestration:
        condition: service_started
    # Explicit controller activation uses "run" below after operator preflight.
    # Default does not execute QA or paid model calls on Compose startup.
    command: ["python", "-m", "quality_gates.native_qa_controller", "preflight"]

networks:
  trusted-control:
    internal: true
