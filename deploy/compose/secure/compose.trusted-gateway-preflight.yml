# Deliberately standalone: DO NOT combine with insecure development docker-compose.yml.
# An offline metadata-only preflight. No gateway process, listening port or side effects.
services:
  trusted-gateway-preflight:
    profiles: ["trusted-gateway-preflight"]
    build:
      context: .
      dockerfile: services/agent-management/Dockerfile.trusted-gateway
    user: "10002:10002"
    read_only: true
    network_mode: "none"
    privileged: false
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: "no"
    environment:
      MAW_TRUSTED_GATEWAY_ENABLED: "1"
      MAW_GATEWAY_WORKSPACE_ROOT: /srv/maw/workspace
      MAW_GATEWAY_ORCHESTRATION_SQLITE: /srv/maw/control/orchestration.db
      MAW_GATEWAY_LEDGER_SQLITE: /srv/maw/ledger/tool-ledger.db
      MAW_GATEWAY_KEY_FILE: /run/maw-secrets/gateway-key
      MAW_GATEWAY_TLS_CERT_FILE: /run/maw-tls/gateway.crt
      MAW_GATEWAY_TLS_KEY_FILE: /run/maw-secrets/gateway-tls.key
    volumes:
      - type: bind
        source: "${MAW_GATEWAY_WORKSPACE_HOST_DIR:-./.maw-gateway-workspace-NOT-CONFIGURED}"
        target: /srv/maw/workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${MAW_GATEWAY_ORCHESTRATION_DB_HOST_FILE:-./.maw-orchestration-db-NOT-CONFIGURED}"
        target: /srv/maw/control/orchestration.db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${MAW_GATEWAY_LEDGER_HOST_DIR:-./.maw-gateway-ledger-NOT-CONFIGURED}"
        target: /srv/maw/ledger
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${MAW_GATEWAY_KEY_HOST_FILE:-./.maw-gateway-key-NOT-CONFIGURED}"
        target: /run/maw-secrets/gateway-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${MAW_GATEWAY_TLS_CERT_HOST_FILE:-./.maw-gateway-cert-NOT-CONFIGURED}"
        target: /run/maw-tls/gateway.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${MAW_GATEWAY_TLS_KEY_HOST_FILE:-./.maw-gateway-tls-key-NOT-CONFIGURED}"
        target: /run/maw-secrets/gateway-tls.key
        read_only: true
        bind:
          create_host_path: false
    command: ["python", "-m", "agent_management.trusted_gateway_cli", "preflight"]
