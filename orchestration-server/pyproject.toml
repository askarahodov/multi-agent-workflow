[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestration-server"
version = "0.1.0"
description = "Platform-owned orchestration server with durable execution, task lifecycle, contract verification, concurrency controls and retry policies."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "jsonschema>=4.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openapi-spec-validator>=0.7"]

[tool.setuptools.packages.find]
include = ["orchestration_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
