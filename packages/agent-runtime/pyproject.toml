[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "Native agent execution engine: isolated workspace provisioning, AgentSpec (role/tool/model/context/permission) enforcement, task DAG execution with parallelism and result passing, retry/timeout/checkpoint+restore, cost/resource limits and quality gates, structured logging and observability hooks."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["agent_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
