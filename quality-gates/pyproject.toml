[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-gates"
version = "0.1.0"
description = "Automated quality-gate pipeline: Tester, Reviewer, Security and Release-Prep gates with auditable evidence and enforced Kanban transitions."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "maw-shared==0.1.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["quality_gates*", "quality_gates.gates*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
