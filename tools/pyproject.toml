[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-workflow-tools"
version = "0.1.0"
description = "Shared platform tooling: Tool Registry (ADR-012), resilience primitives, git-storage facade."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 100